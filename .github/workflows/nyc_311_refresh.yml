name: NYC 311 Data Refresh

on:
  workflow_dispatch: # للتشغيل اليدوي
  schedule:
    - cron: '0 0 * * 0' # سيقوم بتصفير العداد تلقائياً كل يوم أحد

env:
  # هذا السطر ينهي التحذير ويجعل الروبوت يستخدم أحدث نظام تشغيل
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write' 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5 # تم التحديث من v4 لـ v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3 # تم التحديث من v2 لـ v3
        with:
          workload_identity_provider: 'projects/113456966208/locations/global/workloadIdentityPools/depi-pool/providers/github-new-provider'
          service_account: 'dbt-user-311@depi-graduation-project-489604.iam.gserviceaccount.com'

#  بتثبيت dbt-bigquery فقط لتوفير الوقت والموارد
      - name: Install dbt
        run: |
          pip install dbt-bigquery

      - name: Run dbt
        run: |
          mkdir -p ~/.dbt
          cat <<EOF > ~/.dbt/profiles.yml
          default:
            outputs:
              dev:
                type: bigquery
                method: oauth
                project: depi-graduation-project-489604
                dataset: nyc_311_raw_data
                threads: 1
            target: dev
          EOF
          # تشغيل المشروع بالكامل بما فيه جدول التصفير الـ Raw وبقية النماذج
          dbt run --profiles-dir ~/.dbt
          # السطر الجديد الذي أضفناه لتشغيل الاختبارات وتأكيد الـ CI/CD
          dbt test --profiles-dir ~/.dbt

 